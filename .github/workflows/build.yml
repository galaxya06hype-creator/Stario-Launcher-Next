name: Android Build (ChatGPT Edition)

on:
  push:
    branches: [ main, master, chatgpt-ui ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # vendored material-color-utilities, no submodules needed
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
        continue-on-error: false

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare google-services.json (safe dummy)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using secret GOOGLE_SERVICES_JSON"
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "google-services.json already exists, keep it"
          else
            echo "Creating dummy google-services.json for CI (won't crash, Firebase disabled)"
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "dummy-rikkahub",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:dummy",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:dummy2",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            cat app/google-services.json
          fi
          # also for debug variant check
          ls -lh app/google-services.json

      - name: Prepare signing (release only, keep fitur bawaan)
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ] && [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "Signing secrets found, preparing release keystore"
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            cat local.properties
          else
            echo "No secrets - generate dummy keystore for release (fitur bawaan tetap, tidak force-close)"
            # generate dummy keystore for CI release - fix double app/app path bug
            keytool -genkey -v -keystore app/app.key -storepass 123456 -alias ci -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US" 2>&1 | tail
            mkdir -p app/app
            cp app/app.key app/app/app.key 2>/dev/null || true
            cp app/app.key app.key 2>/dev/null || true
            # storeFile relative to app module = app.key (not app/app.key) agar tidak jadi app/app/app.key
            cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=123456
          keyAlias=ci
          keyPassword=123456
          EOF
            cat local.properties
            echo "dummy keystore ready $(ls -lh app/app.key) $(ls -lh app/app/app.key 2>&1 | head)"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK only (1 APK 1 ZIP, tidak bengkak)
        run: |
          ./gradlew assembleRelease --stacktrace
          echo "=== APKs built (release only) ==="
          ls -lh app/build/outputs/apk/release/ || true
          # keep only universal APK to avoid 200MB bloat (splits abi)
          # RikkaHub splits arm64-v8a + x86_64 + universal = 3 APKs, we keep universal only = 1 APK
          if ls app/build/outputs/apk/release/*universal*.apk 1>/dev/null 2>&1; then
            echo "Keeping universal APK only"
            ls app/build/outputs/apk/release/*universal*.apk
            mkdir -p /tmp/single-apk
            cp app/build/outputs/apk/release/*universal*.apk /tmp/single-apk/rikkahub-release.apk
            rm app/build/outputs/apk/release/*.apk
            mv /tmp/single-apk/rikkahub-release.apk app/build/outputs/apk/release/
          elif ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            echo "No universal, keep first APK only"
            ls -lh app/build/outputs/apk/release/*.apk
            mkdir -p /tmp/single-apk
            FIRST=$(ls app/build/outputs/apk/release/*.apk | head -n1)
            cp "$FIRST" /tmp/single-apk/rikkahub-release.apk
            rm app/build/outputs/apk/release/*.apk
            mv /tmp/single-apk/rikkahub-release.apk app/build/outputs/apk/release/
          fi
          ls -lh app/build/outputs/apk/release/
          echo "APK size: $(du -h app/build/outputs/apk/release/*.apk | cut -f1)"

      - name: Upload Release APK (1 ZIP 1 APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          compression-level: 9
