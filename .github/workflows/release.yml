name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 2.17)'
        required: true
        default: '2.17'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks
          echo "KEYSTORE_PATH=/tmp/keystore.jks" >> $GITHUB_ENV

      - name: Build Signed Release
        run: |
          chmod +x gradlew
          if [ -f "/tmp/keystore.jks" ]; then
            ./gradlew assembleRelease bundleRelease \
              -PkeystorePath=/tmp/keystore.jks \
              -PkeystorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
              -PkeyPassword="${{ secrets.KEY_PASSWORD }}" \
              --stacktrace
          else
            echo "No keystore - building unsigned"
            ./gradlew assembleRelease bundleRelease --stacktrace
          fi

      - name: Get Version
        id: version
        run: |
          VER=$(./gradlew -q :app:getVersionName)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Rename Artifacts
        run: |
          mkdir -p release
          VER=${{ steps.version.outputs.version }}
          cp app/build/outputs/apk/release/*.apk release/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab release/ 2>/dev/null || true
          ls -lh release/

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/*

  fdroid:
    name: Verify FDroid / Reproducible Build
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Reproducible Build Check
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%at)" >> $GITHUB_ENV
          ./gradlew assembleRelease --stacktrace
          echo "Verifying build reproducibility..."
          ls -lh app/build/outputs/apk/release/
